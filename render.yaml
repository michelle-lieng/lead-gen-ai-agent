# Render Blueprint — deploys the whole stack (backend + frontend + Postgres).
# Docs: https://render.com/docs/blueprint-spec
#
# In the Render dashboard: New > Blueprint, connect this repo. Render reads this
# file and creates all three resources. You'll be prompted for the two secret
# API keys below (marked `sync: false`).

databases:
  - name: lead-gen-db
    plan: free            # free Postgres expires after 30 days — upgrade for anything long-lived
    region: oregon
    databaseName: ai_lead_generator
    # No `user:` — Render auto-generates one, and the backend reads the full
    # DATABASE_URL (connectionString) below, so the username doesn't matter.

services:
  # ---- Backend: FastAPI ----
  - type: web
    name: lead-gen-backend
    runtime: docker
    plan: free            # free web services sleep when idle (slow first request); use `starter` to stay warm
    region: oregon
    dockerContext: ./backend
    dockerfilePath: ./backend/Dockerfile
    # Bind to the port Render assigns via $PORT instead of the hardcoded 8000.
    dockerCommand: sh -c "uvicorn app.main:app --host 0.0.0.0 --port $PORT"
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: lead-gen-db
          property: connectionString
      - key: OPENAI_API_KEY
        sync: false       # enter in the dashboard (kept out of git)
      - key: JINA_API_KEY
        sync: false
      - key: DEBUG
        value: "false"
      - key: LOG_LEVEL
        value: INFO

  # ---- Frontend: Streamlit ----
  - type: web
    name: lead-gen-frontend
    runtime: docker
    plan: free
    region: oregon
    dockerContext: ./frontend
    dockerfilePath: ./frontend/Dockerfile
    dockerCommand: sh -c "streamlit run app.py --server.port $PORT --server.address 0.0.0.0 --server.headless true --server.enableCORS false --server.enableXsrfProtection false"
    healthCheckPath: /_stcore/health
    envVars:
      # Talks to the backend over Render's private network (host:port; base.py adds http://).
      - key: BACKEND_URL
        fromService:
          type: web
          name: lead-gen-backend
          property: hostport
