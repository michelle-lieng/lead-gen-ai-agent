# Render Blueprint — deploys the FastAPI backend.
# Docs: https://render.com/docs/blueprint-spec
#
# The rest of the stack lives elsewhere:
#   - Frontend: Vercel (frontend-react/, VITE_BACKEND_URL points here)
#   - Database: Supabase Postgres (DATABASE_URL, Transaction pooler URL)
#
# In the Render dashboard: New > Blueprint, connect this repo. You'll be
# prompted for the values marked `sync: false`.

services:
  # ---- Backend: FastAPI ----
  - type: web
    name: lead-gen-backend
    runtime: docker
    plan: free            # free web services sleep when idle (slow first request); use `starter` to stay warm
    region: singapore     # closest Render region to the Supabase database (Tokyo)
    dockerContext: ./backend
    dockerfilePath: ./backend/Dockerfile
    # Bind to the port Render assigns via $PORT instead of the hardcoded 8000.
    # (Render already runs this through a shell, so $PORT expands — no `sh -c` wrapper.)
    dockerCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      # Supabase connection string (Connect > Transaction pooler, port 6543).
      - key: DATABASE_URL
        sync: false
      # The shared password and the API keys. Set their values in the Render
      # dashboard; see backend/env.example.
      - key: APP_PASSWORD
        sync: false
      # Signs sessions; Render generates a random value once.
      - key: AUTH_SECRET
        generateValue: true
      - key: OPENAI_API_KEY
        sync: false
      - key: JINA_API_KEY
        sync: false
      - key: GOOGLE_PLACES_API_KEY
        sync: false
      - key: DEBUG
        value: "false"
      - key: LOG_LEVEL
        value: INFO
      # Browser origins allowed to call the API (comma-separated): the Vercel frontend.
      - key: CORS_ALLOW_ORIGINS
        value: https://lead-gen-frontend-theta.vercel.app,https://lead-gen-frontend-michelle-liengs-projects.vercel.app
